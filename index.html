<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Robot Access Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h2>Delivery Assistant Robot</h2>
            <span id="status-badge" class="locked">LOCKED</span>
        </header>

        <div class="main-status">
            <h3>ROBOT ARRIVED AT DESTINATION</h3>
        </div>

        <div class="auth-box">
            <h3>Compartment Authorization</h3>
            <p>Enter the one-time dynamic password:</p>
            <input type="password" id="password-input" placeholder="Enter 4-digit code (e.g., 4826)" maxlength="4">
            <button id="submit-btn" onclick="verifyPassword()">SUBMIT & UNLOCK</button>
        </div>

        <div class="timer-box">
            <h3>Retrieval Countdown</h3>
            <h1 id="timer">30</h1>
            <p>seconds remaining</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
